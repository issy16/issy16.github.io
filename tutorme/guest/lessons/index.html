<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>TutorMe 互動課程</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--main:#2b5c8a;--ink:#1d2430;--mute:#5b6472;--line:#c9d1db;--panel:#f4f6f9;--bg:#ffffff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,'Noto Sans TC','PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif;font-size:15px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-bottom:10px;border-bottom:2px solid var(--main);margin-bottom:16px}
.kick{font-size:12px;font-weight:600;color:var(--main);letter-spacing:.04em}
h1{margin:2px 0 0;font-size:24px;line-height:1.2}
.back{font-size:13px;color:var(--mute)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:8px;padding:14px 16px;text-decoration:none;color:inherit}
.item:hover{border-color:var(--main)}
.item b{display:block;font-size:16px}
.item span{font-size:13px;color:var(--mute)}
.go{color:var(--main);font-weight:600;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><div class="kick">TutorMe · 互動課程</div><h1>課程列表</h1></div>
    <a class="back" href="../student/">← 單字本</a>
  </header>
  <div class="list">
    <a class="item" href="hero-hidden/">
      <div><b>A Hero, Hidden</b><span>龍騰第三冊 · 閱讀素養專欄 · 9 關</span></div>
      <span class="go">開始 →</span>
    </a>
  </div>
</div>
</body>
</html>
