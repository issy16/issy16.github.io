<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A Hero, Hidden 互動課</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Cormorant+Garamond:ital,wght@1,600&display=swap">
<style>
/* Layout: sticky mission bar with segmented progress on top, one mission card at a time below, centered column ≤ 760px */
:root{
  --bg:#ffffff; --surface:#f4f6f9; --raise:#ffffff; --line:#c9d1db; --line-soft:#e3e8ee;
  --fg:#1d2430; --muted:#5b6472; --opt:#3a4350;
  --accent:#2b5c8a; --accent-soft:#e7eef6; --on-accent:#ffffff;
  --good:#2f7a4c; --good-soft:#e5f3ea; --bad:#b1432f; --bad-soft:#fbeae6; --gold:#b07d1a; --gold-soft:#fbf2dc;
  --f-body:Inter,'Noto Sans TC','PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif;
  --f-display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151c; --surface:#18202a; --raise:#1c2531; --line:#33404f; --line-soft:#26303c;
  --fg:#e6ebf1; --muted:#9aa6b4; --opt:#c5ced9;
  --accent:#86b4e2; --accent-soft:#1e2e40; --on-accent:#0d1a27;
  --good:#6cc28f; --good-soft:#18301f; --bad:#ec8d78; --bad-soft:#3a201b; --gold:#e2b55a; --gold-soft:#33291a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151c; --surface:#18202a; --raise:#1c2531; --line:#33404f; --line-soft:#26303c;
  --fg:#e6ebf1; --muted:#9aa6b4; --opt:#c5ced9;
  --accent:#86b4e2; --accent-soft:#1e2e40; --on-accent:#0d1a27;
  --good:#6cc28f; --good-soft:#18301f; --bad:#ec8d78; --bad-soft:#3a201b; --gold:#e2b55a; --gold-soft:#33291a; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line-soft);
  padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.bar-top{display:flex;justify-content:flex-end;align-items:center;gap:12px;flex-wrap:wrap}
.kicker{font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.04em}
.stats{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.xp{font-weight:700;color:var(--gold);background:var(--gold-soft);border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums}
.pct{font-variant-numeric:tabular-nums}
.tbtn{border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted)}
.tbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.segs{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.vkey{font-size:13px;color:var(--muted)}
.vkey b{color:var(--accent)}
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.vcard{border:1px solid var(--line);border-radius:10px;background:var(--raise);display:flex;flex-direction:column;min-width:0;transition:border-color .15s}
.vcard.on{border-color:var(--accent)}
.vflip{border:0;background:none;text-align:left;padding:12px 14px;display:flex;flex-direction:column;gap:3px;flex:1}
.vtop{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.vw{font-size:18px;font-weight:700}
.vp{font-size:12px;color:var(--muted)}
.vr{font-size:14px;color:var(--muted);letter-spacing:.03em}
.vr b{color:var(--accent);font-weight:700}
.vb{margin-top:6px;padding-top:6px;border-top:1px solid var(--line-soft);font-size:14px;display:flex;flex-direction:column;gap:2px}
.vb .zh{font-weight:600}
.vb .ex{color:var(--opt)}
.vhint{font-size:12px;color:var(--muted);margin-top:4px}
.vplay{border:0;border-top:1px solid var(--line-soft);background:none;padding:7px 14px;text-align:left;font-size:12px;font-weight:600;color:var(--accent)}
@media (max-width:520px){.vgrid{grid-template-columns:1fr}}
.seg{height:28px;border:0;border-radius:5px;background:var(--surface);position:relative;overflow:hidden;font-size:11px;color:var(--muted);padding:0;font-weight:600;font-variant-numeric:tabular-nums}
.seg.done{background:var(--accent);color:var(--on-accent)}
.seg.cur{box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent)}
.seg.done.cur{color:var(--on-accent);box-shadow:inset 0 0 0 2px var(--fg)}

main{padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.hero{display:flex;flex-direction:column;gap:6px;padding-bottom:6px}
.hero h1{margin:0;font-family:var(--f-display);font-style:italic;font-weight:600;font-size:clamp(34px,7vw,48px);line-height:1.05;letter-spacing:.01em;text-wrap:balance}
.hero .sub{color:var(--muted);font-size:14px}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.who input{border:0;border-bottom:1px solid var(--line);background:transparent;padding:2px 4px;width:9em;font:inherit;color:var(--fg)}

.mission{display:flex;flex-direction:column;gap:16px}
.mhead{display:flex;gap:12px;align-items:flex-start}
.badge{flex:none;width:34px;height:34px;border-radius:7px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:15px}
.mhead h2{margin:0;font-size:20px;line-height:1.3;text-wrap:balance}
.mhead p{margin:2px 0 0;color:var(--fg);font-size:14.5px}
.mhead p.zh,.zh-s{color:var(--muted);font-size:13px}
.zh-s{display:block;margin-top:1px}
.rules .zh{color:var(--muted);font-size:13px}
.book{display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:8px;padding:10px 14px;font-size:14px}
.book b{color:var(--accent)}
.tip{border-left:3px solid var(--gold);background:var(--gold-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:13.5px;color:var(--fg)}
.tip strong{color:var(--gold)}
.tip ul{margin:4px 0 0;padding-left:18px}

.q{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--line-soft)}
.q:first-of-type{border-top:0;padding-top:0}
.qt{font-weight:600;display:flex;gap:8px}
.zhbtn{flex:none;margin-left:auto;align-self:flex-start;border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:1px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.zhbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.qzh{font-size:14px;color:var(--muted);background:var(--surface);border-radius:6px;padding:6px 10px}
.qt .n{color:var(--accent);flex:none;font-variant-numeric:tabular-nums}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:10px 12px;color:var(--opt);display:flex;gap:10px;align-items:flex-start;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;width:22px;height:22px;border-radius:5px;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700}
.opt.ok{border-color:var(--good);background:var(--good-soft);color:var(--fg)}
.opt.ok .k{background:var(--good);border-color:var(--good);color:var(--bg)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.pick{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.opt:disabled{cursor:default}
.fb{font-size:14px;border-radius:8px;padding:10px 12px}
.fb.good{background:var(--good-soft)}
.fb.good b{color:var(--good)}
.fb.bad{background:var(--bad-soft)}
.fb.bad b{color:var(--bad)}
.fb.neutral{background:var(--accent-soft)}
.ev{display:inline-block;margin-top:4px;font-size:12.5px;font-weight:600;color:var(--accent)}
.shake{animation:sh .32s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:8px;padding:9px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.nav{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line-soft);padding-top:16px}

.timer{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--surface);border-radius:10px;padding:16px}
.clock{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em;min-width:4ch}
.clock.end{color:var(--bad)}
.rules{margin:0;padding-left:18px;color:var(--muted);font-size:14px}

.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 12px}
.mcol{display:flex;flex-direction:column;gap:8px}
.chip{border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:10px 12px;text-align:left;min-height:44px;transition:all .15s}
.chip.en{font-weight:600}
.chip.sel{border-color:var(--accent);background:var(--accent-soft)}
.chip.gone{border-color:var(--good);background:var(--good-soft);color:var(--good);cursor:default}
.chip.no{border-color:var(--bad);background:var(--bad-soft)}
.mstat{display:flex;gap:16px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.mstat b{color:var(--fg)}

.bank{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:var(--surface);border-radius:10px}
.word{border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.word.used{opacity:.35}
.sent{line-height:2.1}
.blank{display:inline-block;min-width:8.5em;border:0;border-bottom:2px solid var(--line);background:transparent;padding:0 6px;text-align:center;font-weight:600;color:var(--accent)}
.blank.act{border-color:var(--accent);background:var(--accent-soft)}
.blank.ok{border-color:var(--good);color:var(--good)}
.blank.no{border-color:var(--bad);color:var(--bad)}

.build{min-height:52px;border:1px dashed var(--line);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.build.ok{border-style:solid;border-color:var(--good);background:var(--good-soft)}
.build:empty::before{content:"點下面的詞塊，依序排成句子";color:var(--muted);font-size:13px;padding-left:4px}
.piece{border:1px solid var(--line);background:var(--raise);border-radius:6px;padding:6px 10px;font-size:14.5px}
.piece.role-s{border-bottom:3px solid var(--accent)}
.legend{font-size:13px;color:var(--muted)}

.reveal{background:var(--surface);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
.reveal p{margin:0}
textarea,.qi{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--raise);padding:10px 12px;font:inherit;color:var(--fg)}
textarea{min-height:76px;resize:vertical}
.made{border:1px solid var(--accent);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.made .lbl{font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.04em}

.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:2px}
.tile .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--muted)}
.multi{display:flex;flex-wrap:wrap;gap:8px}
.tog{border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:6px 14px;font-size:14px}
.tog[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.foot{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.linkish{border:0;background:none;color:var(--muted);text-decoration:underline;padding:0;font-size:12px}
@media (max-width:520px){.sum{grid-template-columns:1fr 1fr}.segs{gap:3px}.seg{font-size:10px}.clock{font-size:36px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<div class="bar">
  <div class="bar-in">
    <div class="bar-top">
      <div class="stats">
        <span class="pct" id="pct">0 / 9 stages</span>
        <span class="xp" id="xp">0 XP</span>
      </div>
    </div>
    <div class="segs" id="segs" role="tablist" aria-label="Stages"></div>
  </div>
</div>

<main>
  <div class="wrap">
    <div class="hero">
      <h1>A Hero, Hidden</h1>
      <div class="sub">9 stages · earn XP in every stage<span class="zh-s">被藏起來的英雄 · 9 關 · 每關計 XP</span></div>
      <div class="who"><label for="nm">Player</label><input id="nm" placeholder="Your name" maxlength="12"></div>
    </div>
    <section class="mission" id="stage" aria-live="polite"></section>
    <div class="foot"><span><a href="../" style="color:var(--muted)">← All lessons</a> · Use your textbook for the passage. 課文請看課本。</span><span id="resetArea"><button class="linkish" id="reset">Reset 重新開始</button></span></div>
  </div>
</main>

<script>
(function(){
const KEY='hero-hidden-v2';
let S={cur:0,xp:0,done:{},solved:{},name:'',bestMatch:null,likes:[],dislikes:[],note:''};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
let teacher=false;
const $=(s,r=document)=>r.querySelector(s);
const el=(t,a={},...kids)=>{const n=document.createElement(t);for(const k in a){if(k==='class')n.className=a[k];else if(k==='html')n.innerHTML=a[k];else if(k.startsWith('on'))n.addEventListener(k.slice(2),a[k]);else n.setAttribute(k,a[k]);}kids.flat().forEach(c=>{if(c!=null)n.append(c.nodeType?c:document.createTextNode(c));});return n;};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const L='ABCDE';

function addXP(n){S.xp+=n;save();paintBar();}
function markDone(i){if(!S.done[i]){S.done[i]=true;save();paintBar();}}

/* ---------- multiple choice ---------- */
const ZHQ={
 p1:'畫裡的人正在翻一箱禮物。你覺得這篇故事在講什麼？',
 p2:'如果有個英雄「被藏起來」，你覺得是誰把他藏起來的？',
 s1:'用一句話說，這篇文章在講什麼？',
 d1:'這篇文章主要在講什麼？',
 d2:'阿基里斯的媽媽為什麼要把他藏起來？',
 d3:'阿基里斯在斯基羅斯島上是怎麼被藏起來的？',
 d4:'奧德修斯為什麼要在禮物裡放劍和盾？',
 d5:'第 11 行「a troubling prophecy overshadowed his future」的意思是這個預言＿＿。',
 e1:'你覺得接下來發生了什麼事？',
 e2:'所以「Achilles’ heel」是什麼意思？例：Math is my Achilles’ heel.'
};
function mc(id,{q,opts,ans,ok,ev,hint,n,predict}){
  const box=el('div',{class:'q'});
  const zq=ZHQ[id];let zline=null,zb=null;
  if(zq){zline=el('div',{class:'qzh'},zq);zline.hidden=true;
    zb=el('button',{class:'zhbtn','aria-pressed':'false',title:'Show the question in Chinese'},'中文');
    zb.addEventListener('click',()=>{zline.hidden=!zline.hidden;zb.setAttribute('aria-pressed',!zline.hidden);});}
  box.append(el('div',{class:'qt'},n?el('span',{class:'n'},n):null,el('span',{style:'min-width:0'},q),zb));
  if(zline)box.append(zline);
  const list=el('div',{class:'opts'}), fb=el('div');
  let tries=0;
  const prev=S.solved[id];
  opts.forEach((o,i)=>{
    const b=el('button',{class:'opt'},el('span',{class:'k'},L[i]),el('span',{},o));
    b.addEventListener('click',()=>{
      if(predict){
        [...list.children].forEach(c=>{c.classList.remove('pick');c.disabled=true;});
        b.classList.add('pick');
        if(S.solved[id]===undefined){S.solved[id]=i;addXP(5);}
        fb.className='fb neutral';fb.innerHTML='<b>Prediction locked.</b> Revealed in Stage 8. 第 8 關揭曉。';
        box.dispatchEvent(new Event('solved'));return;
      }
      tries++;
      if(i===ans){
        [...list.children].forEach(c=>c.disabled=true);
        b.classList.add('ok');
        if(S.solved[id]===undefined){S.solved[id]=i;addXP(tries===1?10:4);}
        fb.className='fb good';fb.innerHTML='<b>'+(tries===1?'PERFECT +10 XP':'CLEAR +4 XP')+'</b> '+(ok||'')+(ev?'<br><span class="ev">證據：課本第 '+ev+' 行</span>':'');
        box.dispatchEvent(new Event('solved'));
      }else{
        b.classList.add('no');b.disabled=true;b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');
        fb.className='fb bad';fb.innerHTML='<b>MISS</b> '+(hint||'回課本找證據。');
      }
    });
    list.append(b);
  });
  box.append(list,fb);
  if(prev!==undefined){
    [...list.children].forEach(c=>c.disabled=true);
    const b=list.children[prev];
    if(predict){b.classList.add('pick');fb.className='fb neutral';fb.innerHTML='<b>你的預測：'+L[prev]+'</b>';}
    else{b.classList.add('ok');fb.className='fb good';fb.innerHTML='<b>CLEAR</b> '+(ok||'')+(ev?'<br><span class="ev">證據：課本第 '+ev+' 行</span>':'');}
    box.dataset.solved='1';
  }
  box.addEventListener('solved',()=>box.dataset.solved='1');
  return box;
}
function watch(boxes,i,onAll){
  const check=()=>{if(boxes.every(b=>b.dataset.solved)){markDone(i);onAll&&onAll();}};
  boxes.forEach(b=>b.addEventListener('solved',()=>setTimeout(check)));check();
}

/* ---------- stages ---------- */
const VOCAB=[
 ['myth','n.','MITH','神話','Many myths explain how the world began.'],
 ['legendary','adj.','LEJ-uhn-dair-ee','傳奇的；傳說的','He became a legendary player in the game’s history.'],
 ['warrior','n.','WOR-ee-er','戰士；勇士','The warrior fought to protect his village.'],
 ['combat','n.','KOM-bat','戰鬥','The soldiers were trained for combat.'],
 ['prophecy','n.','PROF-uh-see','預言','The prophecy said the city would fall.'],
 ['overshadow','v.','oh-ver-SHAD-oh','使蒙上陰影；使相形見絀','Her success was overshadowed by an injury.'],
 ['destined','adj.','DES-tind','注定的','He seemed destined to win from the start.'],
 ['disguise','v.','dis-GYZE','偽裝；喬裝','She disguised herself with a hat and glasses.'],
 ['devise','v.','dih-VYZE','想出；設計','We devised a plan to finish the project early.'],
 ['array','n.','uh-RAY','一系列；大量','The shop offers an array of drinks.'],
 ['shield','n.','SHEELD','盾牌；保護','He raised his shield to block the arrow.']
];
function say(w){try{const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
const STAGES=[
{short:'Vocab',title:'Vocabulary Preview',sub:'Say each word out loud and guess its meaning. Then tap the card to check. Flip all 11 cards to clear.',zh:'先自己唸、猜意思，再點開卡片確認。全部翻開即過關。',
 tip:['約 5 分鐘。讓他照大寫音節唸一次，重音唸錯就請他按「播放」對照。','翻卡前先問他猜什麼意思，猜對或猜錯都可以，重點是先動腦。'],
 render(box,i){
  box.append(el('div',{class:'vkey'},'Stress: syllables in ',el('b',{},'BLUE CAPS'),' are stressed, e.g. dis-',el('b',{},'GYZE'),'.',el('span',{class:'zh-s'},'大寫藍字是重音節，例如 disguise 重音在第二音節。')));

{short:'Match',title:'Word Match',sub:'Tap a word, then tap its meaning. Your time is recorded.',zh:'點英文，再點對應的中文。完成會記錄時間。',
 tip:['約 5 分鐘。可以玩兩次，第二次通常會快很多，讓他看到進步。','這 8 個字都是大考詞彙（課本有 * 號），可以問他記最快的是哪個、為什麼。'],
 render(box,i){
  const W=[['myth','神話'],['legendary','傳奇的'],['warrior','戰士'],['combat','戰鬥'],['prophecy','預言'],['disguise','偽裝；喬裝'],['devise','想出；設計'],['shield','盾牌；保護']];
  const stat=el('div',{class:'mstat'});
  let selEn=null,selZh=null,matched=0,miss=0,t0=null,tick=null;
  const showStat=(extra)=>{const s=t0?((Date.now()-t0)/1000).toFixed(1):'0.0';stat.innerHTML='Time <b>'+s+'s</b><span>Misses <b>'+miss+'</b></span><span>Best <b>'+(S.bestMatch?S.bestMatch.toFixed(1)+'s':'—')+'</b></span>'+(extra||'');};
  const grid=el('div',{class:'match'}),cEn=el('div',{class:'mcol'}),cZh=el('div',{class:'mcol'});
  const again=el('button',{class:'btn ghost'},'Replay');
  function build(){
    selEn=selZh=null;matched=0;miss=0;t0=null;clearInterval(tick);
    cEn.replaceChildren();cZh.replaceChildren();
    shuffle(W).forEach(([en])=>cEn.append(mk(en,'en')));
    shuffle(W).forEach(([,zh])=>cZh.append(mk(zh,'zh')));
    showStat();
  }
  function mk(txt,side){
    const b=el('button',{class:'chip '+side},txt);b.dataset.v=txt;
    b.addEventListener('click',()=>{
      if(b.classList.contains('gone'))return;
      if(!t0){t0=Date.now();tick=setInterval(()=>showStat(),100);}
      const col=side==='en'?cEn:cZh;[...col.children].forEach(c=>c.classList.remove('sel'));
      b.classList.add('sel');if(side==='en')selEn=b;else selZh=b;
      if(selEn&&selZh){
        const pair=W.find(w=>w[0]===selEn.dataset.v);
        const a=selEn,z=selZh;selEn=selZh=null;
        if(pair[1]===z.dataset.v){
          [a,z].forEach(x=>{x.classList.remove('sel');x.classList.add('gone');});matched++;
          if(matched===W.length){clearInterval(tick);const sec=(Date.now()-t0)/1000;
            const first=!S.solved.match;const rec=!S.bestMatch||sec<S.bestMatch;
            if(rec)S.bestMatch=sec;S.solved.match=true;save();
            addXP(first?30:(rec?10:3));markDone(i);
            showStat('<span style="color:var(--good)"><b>'+(rec?'NEW RECORD':'CLEAR')+' +'+(first?30:(rec?10:3))+' XP</b></span>');}
        }else{
          miss++;[a,z].forEach(x=>{x.classList.remove('sel');x.classList.add('no');setTimeout(()=>x.classList.remove('no'),450);});
        }
      }
    });
    return b;
  }
  again.addEventListener('click',build);
  grid.append(cEn,cZh);box.append(stat,grid,el('div',{class:'row'},again));build();
  if(S.solved.match)markDone(i);
 }},

/* ---------- shell ---------- */
function paintBar(){
  const segs=$('#segs');segs.replaceChildren();
  STAGES.forEach((s,k)=>{const b=el('button',{class:'seg'+(S.done[k]?' done':'')+(k===S.cur?' cur':''),role:'tab','aria-selected':k===S.cur?'true':'false',title:s.title},(k+1)+' '+s.short);
    b.addEventListener('click',()=>go(k));segs.append(b);});
  $('#pct').textContent=Object.keys(S.done).length+' / '+STAGES.length+' stages';
  $('#xp').textContent=S.xp+' XP';
  document.dispatchEvent(new Event('xp'));
}
function go(k){S.cur=k;save();render();window.scrollTo({top:0,behavior:'smooth'});}
function render(){
  const s=STAGES[S.cur],box=$('#stage');box.replaceChildren();
  box.append(el('div',{class:'mhead'},el('div',{class:'badge'},(S.cur+1)+''),el('div',{},el('h2',{},'Stage '+(S.cur+1)+' \u00b7 '+s.title),el('p',{},s.sub),s.zh?el('p',{class:'zh'},s.zh):null)));
  if(teacher)box.append(el('div',{class:'tip'},el('strong',{},'教師提示'),el('ul',{},...s.tip.map(t=>el('li',{},t)))));
  const body=el('div',{style:'display:flex;flex-direction:column;gap:14px'});box.append(body);s.render(body,S.cur);
  const prev=el('button',{class:'btn ghost'},'Back'),LAST=STAGES.length-1,next=el('button',{class:'btn'},S.cur===LAST?'Back to Stage 1':'Next');
  if(S.cur===0)prev.disabled=true;
  prev.addEventListener('click',()=>go(S.cur-1));next.addEventListener('click',()=>go(S.cur===LAST?0:S.cur+1));
  box.append(el('div',{class:'nav'},prev,next));
  paintBar();
}
const nm=$('#nm');nm.value=S.name||'';nm.addEventListener('input',()=>{S.name=nm.value.trim();save();});
$('#reset').addEventListener('click',()=>{
  const area=$('#resetArea');area.replaceChildren('確定清除所有進度？ ',
    el('button',{class:'linkish',onclick:()=>{S={cur:0,xp:0,done:{},solved:{},name:S.name,bestMatch:null,likes:[],dislikes:[],note:''};save();location.reload();}},'確定'),' · ',
    el('button',{class:'linkish',onclick:()=>location.reload()},'取消'));
});
render();
})();
</script>

</body></html>
